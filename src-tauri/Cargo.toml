[package]
name = "repert2r"
version = "1.0.0"
description = "Repert2r"
authors = ["Repert2r"]
edition = "2021"

[lib]
name = "repert2r_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ort = { version = "2.0.0-rc.15", features = ["download-binaries", "directml"] }
rustfft = "6.4"
